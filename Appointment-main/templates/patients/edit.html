{% extends 'base.html' %}
{% block title %}Edit Patient{% endblock %}
{% block content %}

<div class="breadcrumb">
  <a href="{{ url_for('patients_list') }}">🧑 Patients</a>
  <span class="sep">›</span>
  <a href="{{ url_for('patients_detail', id=patient.id) }}">{{ patient.name }}</a>
  <span class="sep">›</span> Edit
</div>

<div class="page-header">
  <div><h1>✏️ Edit Patient</h1></div>
</div>

<div class="card">
  <div class="card-header"><h2>Update Patient Information</h2></div>
  <div class="card-body">
    <form method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input class="form-control" id="name" name="name" type="text"
                 value="{{ patient.name }}" required>
        </div>
        <div class="form-group">
          <label for="gender">Gender</label>
          <select class="form-control" id="gender" name="gender">
            <option value="">-- Select Gender --</option>
            <option value="Male"   {{ 'selected' if patient.gender == 'Male'   else '' }}>Male</option>
            <option value="Female" {{ 'selected' if patient.gender == 'Female' else '' }}>Female</option>
            <option value="Other"  {{ 'selected' if patient.gender == 'Other'  else '' }}>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="age">Age</label>
          <input class="form-control" id="age" name="age" type="number" min="0" max="150"
                 value="{{ patient.age or '' }}">
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input class="form-control" id="phone" name="phone" type="tel"
                 value="{{ patient.phone or '' }}">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input class="form-control" id="email" name="email" type="email"
                 value="{{ patient.email or '' }}">
        </div>
        <div class="form-group">
          <label for="address">Address</label>
          <input class="form-control" id="address" name="address" type="text"
                 value="{{ patient.address or '' }}">
        </div>
      </div>
      <div class="action-group" style="margin-top:.5rem">
        <button class="btn btn-warning" type="submit">💾 Update Patient</button>
        <a href="{{ url_for('patients_detail', id=patient.id) }}" class="btn btn-secondary">✕ Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
