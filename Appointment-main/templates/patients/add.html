{% extends 'base.html' %}
{% block title %}Add Patient{% endblock %}
{% block content %}

<div class="breadcrumb">
  <a href="{{ url_for('patients_list') }}">🧑 Patients</a>
  <span class="sep">›</span> Add Patient
</div>

<div class="page-header">
  <div><h1>➕ Add New Patient</h1></div>
</div>

<div class="card">
  <div class="card-header"><h2>Patient Information</h2></div>
  <div class="card-body">
    <form method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input class="form-control" id="name" name="name" type="text"
                 placeholder="e.g. Jane Doe" required>
        </div>
        <div class="form-group">
          <label for="gender">Gender</label>
          <select class="form-control" id="gender" name="gender">
            <option value="">-- Select Gender --</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="age">Age</label>
          <input class="form-control" id="age" name="age" type="number" min="0" max="150"
                 placeholder="e.g. 30">
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input class="form-control" id="phone" name="phone" type="tel"
                 placeholder="e.g. +91 9876543210">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input class="form-control" id="email" name="email" type="email"
                 placeholder="e.g. patient@email.com">
        </div>
        <div class="form-group">
          <label for="address">Address</label>
          <input class="form-control" id="address" name="address" type="text"
                 placeholder="e.g. 123 Main St, City">
        </div>
      </div>
      <div class="action-group" style="margin-top:.5rem">
        <button class="btn btn-success" type="submit">💾 Save Patient</button>
        <a href="{{ url_for('patients_list') }}" class="btn btn-secondary">✕ Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
