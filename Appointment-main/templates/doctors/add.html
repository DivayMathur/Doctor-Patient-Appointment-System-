{% extends 'base.html' %}
{% block title %}Add Doctor{% endblock %}
{% block content %}

<div class="breadcrumb">
  <a href="{{ url_for('doctors_list') }}">👨‍⚕️ Doctors</a>
  <span class="sep">›</span> Add Doctor
</div>

<div class="page-header">
  <div><h1>➕ Add New Doctor</h1></div>
</div>

<div class="card">
  <div class="card-header"><h2>Doctor Information</h2></div>
  <div class="card-body">
    <form method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input class="form-control" id="name" name="name" type="text"
                 placeholder="e.g. John Smith" required>
        </div>
        <div class="form-group">
          <label for="specialization">Specialization *</label>
          <select class="form-control" id="specialization" name="specialization" required>
            <option value="">-- Select Specialization --</option>
            <option>Cardiology</option>
            <option>Dermatology</option>
            <option>Gastroenterology</option>
            <option>General Medicine</option>
            <option>Gynecology</option>
            <option>Neurology</option>
            <option>Oncology</option>
            <option>Ophthalmology</option>
            <option>Orthopedics</option>
            <option>Pediatrics</option>
            <option>Psychiatry</option>
            <option>Radiology</option>
            <option>Surgery</option>
            <option>Urology</option>
            <option>ENT</option>
          </select>
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input class="form-control" id="phone" name="phone" type="tel"
                 placeholder="e.g. +91 9876543210">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input class="form-control" id="email" name="email" type="email"
                 placeholder="e.g. doctor@clinic.com">
        </div>
        <div class="form-group" style="grid-column: span 2;">
          <label for="available_days">Available Days</label>
          <input class="form-control" id="available_days" name="available_days" type="text"
                 placeholder="e.g. Mon, Tue, Wed, Fri">
        </div>
      </div>
      <div class="action-group" style="margin-top:.5rem">
        <button class="btn btn-primary" type="submit">💾 Save Doctor</button>
        <a href="{{ url_for('doctors_list') }}" class="btn btn-secondary">✕ Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
