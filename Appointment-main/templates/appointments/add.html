{% extends 'base.html' %}
{% block title %}New Appointment{% endblock %}
{% block content %}

<div class="breadcrumb">
  <a href="{{ url_for('appointments_list') }}">📅 Appointments</a>
  <span class="sep">›</span> New Appointment
</div>

<div class="page-header">
  <div><h1>➕ Schedule Appointment</h1></div>
</div>

<div class="card">
  <div class="card-header"><h2>Appointment Details</h2></div>
  <div class="card-body">
    <form method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label for="patient_id">Patient *</label>
          <select class="form-control" id="patient_id" name="patient_id" required>
            <option value="">-- Select Patient --</option>
            {% for p in patients %}
              <option value="{{ p.id }}">{{ p.name }} (ID: {{ p.id }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="doctor_id">Doctor *</label>
          <select class="form-control" id="doctor_id" name="doctor_id" required>
            <option value="">-- Select Doctor --</option>
            {% for d in doctors %}
              <option value="{{ d.id }}">Dr. {{ d.name }} — {{ d.specialization }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="appointment_date">Date *</label>
          <input class="form-control" id="appointment_date" name="appointment_date"
                 type="date" required>
        </div>
        <div class="form-group">
          <label for="appointment_time">Time *</label>
          <input class="form-control" id="appointment_time" name="appointment_time"
                 type="time" required>
        </div>
        <div class="form-group">
          <label for="status">Status</label>
          <select class="form-control" id="status" name="status">
            <option value="Scheduled">📅 Scheduled</option>
            <option value="Completed">✅ Completed</option>
            <option value="Cancelled">❌ Cancelled</option>
          </select>
        </div>
        <div class="form-group">
          <label for="reason">Reason for Visit</label>
          <input class="form-control" id="reason" name="reason" type="text"
                 placeholder="e.g. Regular checkup, Fever, Follow-up">
        </div>
      </div>
      <div class="action-group" style="margin-top:.5rem">
        <button class="btn btn-primary" type="submit">💾 Schedule Appointment</button>
        <a href="{{ url_for('appointments_list') }}" class="btn btn-secondary">✕ Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
